name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify committed frontend bundle
        working-directory: .
        run: git diff --exit-code -- static/app
      - run: npm audit --audit-level=moderate

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all targets
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets --locked
      - name: Build release executable
        run: cargo build --release --locked

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose models
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --pull --tag ycloud:ci .
      - name: Verify non-root image metadata
        run: test "$(docker inspect --format '{{.Config.User}}' ycloud:ci)" = "10001:10001"
      - name: Run hardened container
        run: |
          docker volume create ycloud-ci-data
          docker run --detach --name ycloud-ci \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --volume ycloud-ci-data:/var/lib/ycloud \
            --env ALLOW_LAN_HTTP=true \
            --env SECURE_COOKIES=false \
            ycloud:ci
          sleep 5
          if [ "$(docker inspect --format '{{.State.Running}}' ycloud-ci)" != "true" ]; then
            docker logs ycloud-ci
            exit 1
          fi
      - name: Clean container test resources
        if: always()
        run: |
          docker rm --force ycloud-ci 2>/dev/null || true
          docker volume rm ycloud-ci-data 2>/dev/null || true
