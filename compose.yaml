name: ycloud

services:
  ycloud:
    build: .
    image: ycloud:local
    restart: unless-stopped
    # Optional: use an account that can write to the mounted data directory.
    # user: "1000:1000"
    # Optional: allow active requests more time to finish before forced shutdown.
    # stop_grace_period: 60s
    ports:
      - "18473:18473"
    volumes:
      - ./data:/var/lib/ycloud
      - ./storage:/var/lib/ycloud/storage
