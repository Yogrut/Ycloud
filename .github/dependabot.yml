version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns:
          - "aws-*"
      rust-runtime:
        patterns:
          - axum
          - tokio
          - tower
          - "tower-*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      vue-runtime:
        patterns:
          - vue
          - "@vue/*"
      build-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - vue-tsc
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-*"
          - typescript-eslint
          - globals
      tests:
        patterns:
          - vitest
          - happy-dom

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
