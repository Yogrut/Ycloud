<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件预览</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="preview-body">
  <header class="preview-toolbar">
    <span class="preview-title" id="fileName">加载中…</span>
    <div class="preview-actions"><button class="icon-btn" type="button" data-theme-toggle><span class="theme-glyph" aria-hidden="true"></span></button><button class="btn btn-secondary" id="download">下载</button><button class="btn btn-secondary" id="close">关闭</button></div>
  </header>
  <main class="preview-content" id="content"><span>加载中…</span></main>
  <script src="/preview.js" defer></script>
</body>
</html>
