<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ycloud</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-account" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M6.376 18.91a6 6 0 0 1 11.249.003"/><circle cx="12" cy="11" r="4"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m18 11-6-6-6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v10H3z" fill="currentColor" opacity=".22"/><path d="M3 6.5h7l2 2h9v10H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="m5 17 4-4 3 3 2-2 5 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17V6l10-2v11" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="18" r="3" fill="currentColor" opacity=".3" stroke="currentColor"/><circle cx="16" cy="16" r="3" fill="currentColor" opacity=".3" stroke="currentColor"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M5 3h14v18H5z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 3h4v3h-4zm0 6h4v3h-4zm0 6h4v3h-4z" fill="currentColor"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v5h5M8 16h8M8 12h5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8 4 12l4 4m8-8 4 4-4 4m-2-10-4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v5h5M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v5h5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  </svg>

  <header class="topbar browser-topbar">
    <div class="brand"><svg aria-hidden="true"><use href="#i-cloud"></use></svg><span>Ycloud</span></div>
    <label class="top-search" for="searchInput">
      <svg aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="searchInput" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" autocomplete="off">
    </label>
    <div class="top-file-actions">
      <button class="icon-btn" id="adminButton" type="button" title="管理员" aria-label="管理员"><svg aria-hidden="true"><use href="#i-account"></use></svg></button>
      <button class="icon-btn write-control" id="newFolderButton" type="button" title="新建文件夹" aria-label="新建文件夹"><svg aria-hidden="true"><use href="#i-folder-plus"></use></svg></button>
      <button class="icon-btn write-control" id="uploadButton" type="button" title="上传文件" aria-label="上传文件"><svg aria-hidden="true"><use href="#i-upload"></use></svg></button>
      <button class="icon-btn" type="button" data-theme-toggle><span class="theme-glyph" aria-hidden="true"></span></button>
      <button class="icon-btn" id="logoutButton" type="button" title="退出登录" aria-label="退出登录"><svg aria-hidden="true"><use href="#i-logout"></use></svg></button>
    </div>
  </header>

  <main class="page">
    <section class="browser-meta">
      <nav class="breadcrumb" id="breadcrumb" aria-label="当前位置"></nav>
    </section>
    <section class="file-panel glass">
      <div class="file-head">
        <button class="select-box" id="selectAllButton" type="button" aria-label="全选"></button>
        <button class="sort-btn" type="button" data-sort="name">名称 <span data-indicator="name"></span></button>
        <button class="sort-btn right modified" type="button" data-sort="time">修改时间 <span data-indicator="time"></span></button>
        <button class="sort-btn right" type="button" data-sort="size">大小 <span data-indicator="size"></span></button>
      </div>
      <div id="fileList"></div>
      <div class="empty hidden" id="emptyState">此文件夹为空</div>
    </section>
  </main>

  <input class="hidden" type="file" id="fileInput" multiple>
  <div class="toast" id="toast" role="status"></div>
  <div class="context-menu" id="contextMenu"></div>
  <button class="back-to-top" id="backToTopButton" type="button" title="回到顶部" aria-label="回到顶部"><svg aria-hidden="true"><use href="#i-arrow-up"></use></svg></button>

  <div class="overlay upload-overlay" id="uploadModal" aria-live="polite">
    <div class="modal upload-modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <div class="upload-heading">
        <div class="upload-heading-icon"><svg aria-hidden="true"><use href="#i-upload"></use></svg></div>
        <div><h3 id="uploadTitle">上传进度</h3><p id="uploadSummary">正在准备上传</p></div>
      </div>
      <div class="upload-file-line"><span id="uploadFileName">—</span><strong id="uploadPercent">0%</strong></div>
      <progress class="upload-progress-track" aria-label="上传总进度" max="100" value="0" id="uploadProgress"></progress>
      <div class="upload-metrics"><span id="uploadBytes">0 B / 0 B</span><span id="uploadSpeed">0 B/s</span></div>
      <p class="upload-status" id="uploadStatus">请保持页面打开，文件会逐个上传</p>
      <div class="upload-results" id="uploadResults"></div>
      <div class="modal-actions"><button class="btn btn-secondary" id="uploadCloseButton" type="button" disabled>完成</button></div>
    </div>
  </div>

  <div class="overlay" id="folderModal">
    <div class="modal">
      <h3>新建文件夹</h3>
      <div class="field"><label for="folderName">名称</label><input id="folderName" autocomplete="off"></div>
      <p class="error hidden" id="folderError"></p>
      <div class="modal-actions"><button class="btn btn-secondary" data-close="folderModal" type="button">取消</button><button class="btn btn-primary" id="createFolderButton" type="button">创建</button></div>
    </div>
  </div>

  <div class="overlay" id="pickerModal">
    <div class="modal wide">
      <h3 id="pickerTitle">选择目标文件夹</h3>
      <div class="picker-path" id="pickerPath"></div>
      <div class="picker-list" id="pickerList"></div>
      <div class="modal-actions"><button class="btn btn-secondary" data-close="pickerModal" type="button">取消</button><button class="btn btn-primary" id="pickerConfirmButton" type="button">选择此处</button></div>
    </div>
  </div>

  <div class="overlay" id="adminModal">
    <div class="modal">
      <h3>管理员登录</h3>
      <div class="field"><label for="adminUser">用户名</label><input id="adminUser" autocomplete="off"></div>
      <div class="field"><label for="adminPass">密码</label><input id="adminPass" type="password" autocomplete="current-password"></div>
      <p class="error hidden" id="adminError">用户名或密码错误</p>
      <div class="modal-actions"><button class="btn btn-secondary" data-close="adminModal" type="button">取消</button><button class="btn btn-primary" id="adminLoginButton" type="button">登录</button></div>
    </div>
  </div>

  <script src="/browser-dialog.js" defer></script>
  <script type="module" src="/browser.js"></script>
</body>
</html>
