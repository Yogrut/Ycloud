[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "all"
# Only advisories with no fixed version may be listed here, each with a reason
# and a review trigger. A crate that has a patched release must be upgraded
# instead of ignored.
ignore = [
    # chrono is unmaintained (RUSTSEC-2026-0543) and no version is fixed; keep
    # only until the migration to `time` or `jiff` lands. Tracked in
    # docs/review/2026-11-23-dependency-followups.md.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
