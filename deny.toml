[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "all"
ignore = [
    # aws-sdk-s3 1.143.0 compiles lru 0.16.4 only for its S3 Express identity
    # cache. Ycloud disables S3 Express session authentication when constructing
    # every client, so the affected LruCache::pop path is unreachable. Remove
    # this exception as soon as the AWS SDK accepts lru >= 0.18.2.
    { id = "RUSTSEC-2026-0253", reason = "S3 Express is disabled for every Ycloud S3 client; awaiting an upstream AWS SDK dependency update" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
